[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-archiver"
version = "2.0.0"
description = "Download online course videos for offline viewing using your own session cookie."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "joaocaetanoramos" },
]
keywords = ["course", "video", "downloader", "hls", "m3u8", "bunny", "pandavideo", "scaleup", "hotmart", "kiwify", "astron", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "yt-dlp",
    "pycryptodomex",
    "rich",
]

[project.urls]
Homepage = "https://github.com/joaocaetanoramos/course-archiver"

[project.scripts]
course-archiver = "extrator:main"

[tool.setuptools]
py-modules = ["extrator"]
packages = ["lib"]
